services:
  # Selve webserveren som holder filene dine
  webserver:
    image: nginx:latest
    container_name: nginx_site
    restart: always
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  backend:
    build: ./backend     
    container_name: oleyat_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000  
      - ALLOWED_ORIGIN=https://oleyat.no
    volumes:
      - ./backend/data:/app/data        

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TOKEN}
